version: "3.8"

services:
  pose-estimation-on-nxp-imx:
    container_name: pose-estimation-on-nxp-imx
    image: edgesync.azurecr.io/advantech/object-classification-on-nxp-i-mx-m-plus:1.0.0-Ubuntu22.04-ARM
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - XDG_RUNTIME_DIR=/run/user/0
      - DEBIAN_FRONTEND=noninteractive
      - EI_TFLITE_DELEGATE=npu
      - LD_LIBRARY_PATH=/usr/lib/eiq:/usr/lib
    working_dir: /workspace
    devices:
      - /dev:/dev
    volumes:
      - ./wise-bench.sh:/workspace/wise-bench.sh 
      - ./advantech-pose.py:/workspace/advantech-pose.py
      - ./advantech-model-download.sh:/workspace/advantech-model-download.sh
      - $HOME/.Xauthority:/root/.Xauthority:rw
      - /etc/nnstreamer.ini:/etc/nnstreamer.ini
      - /sys/kernel/debug:/sys/kernel/debug
      - /usr/share/X11:/usr/share/X11
      - /lib/firmware:/lib/firmware
      - /lib/libtinfo.so.5:/lib/libtinfo.so.5
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/user/0:/run/user/0
    entrypoint: ["/bin/bash"]
    network_mode: host
    stdin_open: true
    tty: true
    restart: always
